        // 攔截 console.log 與 console.error
        ['log', 'error'].forEach(level => {
          const original = console[level];
          console[level] = function(...args) {
            original.apply(console, args);
            const message = args.map(a => (typeof a === 'object' ? JSON.stringify(a) : a)).join(' ');
            logOutput.insertAdjacentHTML('beforeend', `<div class="${level}">${message}</div>`);
            // 滾動到底部
            logOutput.scrollTop = logOutput.scrollHeight;
          };
        });

    <script>
        function isEncoded(str) {
            try {
                // 嘗試解碼，如果解碼後與原始不同，表示曾經編碼
                const decoded = decodeURIComponent(str);
                return decoded !== str;
            } catch (e) {
                // 如果解碼失敗，表示包含不合法的 %XX，可能是亂碼
                return false;
            }
        }
        function parseScheme(input) {
            // 使用正則取出協議與內容
            const match = input.match(/^([a-zA-Z]+):(.*)$/);

            if (match) {
                const scheme = match[1] + ":";   // 例如 tel:
                const recipient = match[2];      // 例如 +886909090909
                console.log("協議：", scheme);
                console.log("內容：", recipient);
                return { scheme, recipient };
            } else {
                // 沒有協議時，回傳 null 並保持原始內容
                return { scheme: null, recipient: input };
            }
        }
        function checkUriData(uriData) {
            console.log('checkUriData', uriData);
            ///if (isEncoded(uriData)) { decodeURIComponent(uriData); }  // 是編碼，就解碼。

            let redirect = null;
            
            if (uriData === null) {
                console.log('✅');
                redirect = null;
            } else if (uriData === '') {
                console.log('✅');
                redirect = null;
            } else if (uriData.startsWith('mailto:')) {
                console.log('✅ mailto');
                redirect = true;
            } else if (uriData.startsWith('tel:')) {
                console.log('✅ tel');
                redirect = true;
            } else if (uriData.startsWith('sms:')) {
                console.log('✅ sms');
                redirect = true;
            } else {
                console.log('🟥 mailto 🟥 tel 🟥 sms');
                redirect = false;
            }

            return redirect;
        }
    </script>
